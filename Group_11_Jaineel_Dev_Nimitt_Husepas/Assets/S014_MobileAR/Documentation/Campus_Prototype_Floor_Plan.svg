<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Representative campus building prototype floor plan</title>
<desc id="desc">Ground floor and first floor schematic for the prototype interior embedded in imported Building 23990. Outdoor campus route ends at an inferred open gateway; only Labs 101 through 103 and the representative Student Help Desk use this interior.</desc>
<defs><style>
text{font-family:Arial,sans-serif;fill:#e7f4fa}.title{font-size:25px;font-weight:bold}.sub{font-size:13px;fill:#a9c1cc}.heading{font-size:18px;font-weight:bold;fill:#78e1f4}.label{font-size:13px}.room{fill:#193543;stroke:#708f9e;stroke-width:2}.hall{fill:#294d5a;stroke:#92b2bf;stroke-width:1.5}.lab{fill:#304b5d;stroke:#ad8de2;stroke-width:2}.route{fill:none;stroke:#ffc96c;stroke-width:5;stroke-dasharray:10 6;stroke-linecap:round;stroke-linejoin:round}.pin{fill:#46d8ed;stroke:#06202c;stroke-width:2}
</style></defs>
